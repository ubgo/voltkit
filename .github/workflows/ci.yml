# Manual only (owner's call, 2026-10-13: Actions minutes are a budget). To run automatically again, replace the on: block with:
#   on: [push, pull_request]

# Hand-written (not `volt gen`): voltkit's root is a go.work workspace with no
# root go.mod, so the generated single-module stub does not fit. This is the
# one repo in the fleet with that excuse.
name: ci
on:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: apps/volt/go.mod }
      - uses: ubgo/volt-action@v1
        with: { args: "ci --all" }
